<script>
'use strict';
// ============================================================ 基础
const W = 1280, H = 720, WORLD = 1600, HOUR = 60;

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function txt(s, x, y, size, col, align = 'left', font = FCN, weight = '') { ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function star(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.fill(); }

// ============================================================ 预生成素材

function drawStatic(a) {

const scanCanvas = document.createElement('canvas'); scanCanvas.width = 2; scanCanvas.height = 4;
{ const x = scanCanvas.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, 0, 2, 1); }
let SCAN = null;

const R = srand(1987);
const STARS = Array.from({ length: 70 }, () => ({ x: 70 + R() * 1140, y: 30 + R() * 420, s: 4 + R() * 9 }));
const CURTAIN_STARS = Array.from({ length: 30 }, () => ({ x: R(), y: R(), s: 4 + R() * 6 }));
const DRAWINGS = Array.from({ length: 18 }, () => ({ x: R() * 1220, y: 50 + R() * 190, w: 50 + R() * 40, h: 40 + R() * 30, r: (R() - 0.5) * 0.25, c: ['#e33', '#33e', '#2a2', '#e90', '#a3c'][Math.floor(R() * 5)], k: Math.floor(R() * 3) }));
function kidDrawing(d) {
  ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.r);
  ctx.fillStyle = '#cfc9b8'; ctx.fillRect(0, 0, d.w, d.h);
  ctx.strokeStyle = d.c; ctx.lineWidth = 3; ctx.beginPath();
  if (d.k === 0) { ctx.arc(d.w / 2, d.h * 0.35, d.h * 0.18, 0, 7); ctx.moveTo(d.w / 2, d.h * 0.53); ctx.lineTo(d.w / 2, d.h * 0.85); ctx.moveTo(d.w * 0.3, d.h * 0.65); ctx.lineTo(d.w * 0.7, d.h * 0.65); }
  else if (d.k === 1) { ctx.arc(d.w * 0.35, d.h * 0.5, d.h * 0.25, 0, 7); ctx.moveTo(d.w * 0.25, d.h * 0.25); ctx.lineTo(d.w * 0.2, d.h * 0.05); ctx.moveTo(d.w * 0.45, d.h * 0.25); ctx.lineTo(d.w * 0.5, d.h * 0.05); }
  else { for (let i = 0; i < 3; i++) { ctx.moveTo(d.w * (0.2 + i * 0.25), d.h * 0.8); ctx.lineTo(d.w * (0.2 + i * 0.25), d.h * 0.4); ctx.arc(d.w * (0.2 + i * 0.25), d.h * 0.32, 6, Math.PI / 2, Math.PI * 2.5); } }

// ============================================================ 音频（全部 WebAudio 合成）
const AU = {
  ctx: null, loops: null,
  init() {

  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  noise({ dur = 0.3, type = 'lowpass', freq = 1000, q = 1, gain = 0.3, attack = 0.005, brown = false, when = 0 } = {}) {

  tone({ freq = 440, dur = 0.3, type = 'sine', gain = 0.2, attack = 0.005, slide = null, when = 0 } = {}) {

    const o = C.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);

  startLoops() {

    L.fanG = C.createGain(); L.fanG.gain.value = 0.16; L.fan.connect(lp).connect(L.fanG).connect(this.out); L.fan.start();

    const bp = C.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 2;
    L.buzzG = C.createGain(); L.buzzG.gain.value = 0; L.buzz.connect(bp).connect(L.buzzG).connect(this.out); L.buzz.start();

  },
  stopLoops() {

  },
  setLight(on) { if (this.loops) this.loops.buzzG.gain.setTargetAtTime(on ? 0.05 : 0, this.ctx.currentTime, 0.02); },
  door() { this.noise({ dur: 0.35, freq: 380, gain: 0.7, brown: true }); this.tone({ freq: 95, slide: 40, dur: 0.25, type: 'triangle', gain: 0.5 }); this.tone({ freq: 520, dur: 0.08, type: 'square', gain: 0.04, when: 0.03 }); },
  click() { this.tone({ freq: 1800, dur: 0.03, type: 'square', gain: 0.05 }); },
  error() { this.tone({ freq: 140, dur: 0.25, type: 'square', gain: 0.08 }); },
  camUp() { this.noise({ dur: 0.25, type: 'bandpass', freq: 1500, q: 0.7, gain: 0.15 }); this.tone({ freq: 300, slide: 900, dur: 0.15, gain: 0.05 }); },
  camDown() { this.noise({ dur: 0.2, type: 'bandpass', freq: 1200, q: 0.7, gain: 0.12 }); this.tone({ freq: 900, slide: 300, dur: 0.15, gain: 0.05 }); },
  camSwitch() { this.noise({ dur: 0.12, type: 'highpass', freq: 2000, gain: 0.12 }); this.tone({ freq: 1200, dur: 0.04, type: 'square', gain: 0.03 }); },
  staticBurst() { this.noise({ dur: 0.7, type: 'bandpass', freq: 2500, q: 0.5, gain: 0.2 }); },
  steps(n = 3, gap = 0.45, gain = 0.25) { for (let i = 0; i < n; i++) { this.noise({ when: i * gap, dur: 0.14, freq: 220, brown: true, gain }); this.tone({ when: i * gap, freq: 65, slide: 45, dur: 0.1, type: 'triangle', gain: gain * 0.6 }); } },
  foxyRun() { for (let i = 0; i < 12; i++) { const g = 0.15 + i * 0.05; this.noise({ when: i * 0.19, dur: 0.1, freq: 260, brown: true, gain: g }); this.tone({ when: i * 0.19, freq: 70, slide: 45, dur: 0.08, type: 'triangle', gain: g * 0.5 }); } },
  knock() { for (let i = 0; i < 4; i++) { this.noise({ when: i * 0.2, dur: 0.18, freq: 300, brown: true, gain: 0.8 }); this.tone({ when: i * 0.2, freq: 80, slide: 40, dur: 0.15, type: 'triangle', gain: 0.4 }); } },
  stinger() { this.tone({ freq: 55, dur: 1.3, type: 'sawtooth', gain: 0.22, attack: 0.01 }); this.tone({ freq: 58.3, dur: 1.3, type: 'sawtooth', gain: 0.18, attack: 0.01 }); this.noise({ dur: 0.9, freq: 300, gain: 0.25, brown: true }); },
  laugh() { for (let i = 0; i < 3; i++) this.tone({ when: i * 0.24, freq: 170 - i * 12, slide: 110, dur: 0.17, type: 'triangle', gain: 0.12 }); },
  groan() { this.tone({ freq: 75, slide: 48, dur: 1.8, type: 'sawtooth', gain: 0.06, attack: 0.3 }); },
  clang() { const f = rnd(700, 1500); this.tone({ freq: f, dur: 0.45, type: 'square', gain: 0.035 }); this.tone({ freq: f * 1.47, dur: 0.35, type: 'square', gain: 0.02 }); this.noise({ dur: 0.2, type: 'highpass', freq: 3000, gain: 0.08 }); },
  ring() { for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++) { this.tone({ when: r * 1.6 + i * 0.1, freq: i % 2 ? 480 : 440, dur: 0.09, type: 'square', gain: 0.03 }); } },
  powerDown() { this.tone({ freq: 420, slide: 25, dur: 2.0, type: 'sawtooth', gain: 0.15 }); this.noise({ dur: 0.5, freq: 600, gain: 0.3, brown: true }); },
  mbNote(m) { const f = 440 * Math.pow(2, (m - 69) / 12); this.tone({ freq: f * 2, dur: 0.55, type: 'triangle', gain: 0.11 }); this.tone({ freq: f * 4, dur: 0.3, gain: 0.03 }); },
  chime() { for (let i = 0; i < 6; i++) { this.tone({ when: 0.4 + i * 0.75, freq: 660, dur: 1.6, gain: 0.18 }); this.tone({ when: 0.4 + i * 0.75, freq: 1821, dur: 0.8, gain: 0.05 }); } for (let i = 0; i < 6; i++) this.noise({ when: 3 + i * 0.12, dur: 0.5, type: 'bandpass', freq: 1800 + i * 200, q: 3, gain: 0.05 }); },

    const g = C.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.setValueAtTime(0.5, t + 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    ws.connect(g).connect(this.out);

    for (const f of [310, 470, 655, 890]) { const o = C.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 0.8, t + 1.4); lg.connect(o.frequency); const og = C.createGain(); og.gain.value = 0.25; o.connect(og).connect(ws); o.start(t); o.stop(t + 1.5); }
    lfo.start(t); lfo.stop(t + 1.5);

// 斗牛士之歌（比才，公有领域）——停电时的八音盒
const MELODY = [[72, 1], [74, .5], [72, .5], [69, 1.5], [69, .5], [69, .5], [67, .5], [69, .5], [70, .5], [69, 2], [70, 1], [67, .5], [72, .5], [69, 1.5], [65, .5], [62, .5], [67, .5], [60, 2]];

// ============================================================ 角色绘制
const CHARS = {
  freddy: { name: '弗莱迪', main: '#7a4a26', dark: '#4a2a12', light: '#b98454', eye: '#4fb4ff' },
  bonnie: { name: '邦尼', main: '#5552b0', dark: '#33306e', light: '#9a98e6', eye: '#ff3b6b' },
  chica:  { name: '奇卡', main: '#e6b62a', dark: '#a07812', light: '#fff0b0', eye: '#c070ff' },
  foxy:   { name: '福克斯', main: '#a8452a', dark: '#5e2414', light: '#d9a48a', eye: '#ffd23a' },
};
let GLOW = [];
function glowAt(x, y, r, c) {
  const m = ctx.getTransform(), p = m.transformPoint(new DOMPoint(x, y));
  GLOW.push({ x: p.x, y: p.y, r: r * Math.hypot(m.a, m.b), c });
}
function flushGlow() {
  if (!GLOW.length) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
  for (const g of GLOW) {
    const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r * 3);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.22, g.c); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(g.x, g.y, g.r * 3, 0, 7); ctx.fill();
  }
  ctx.restore(); GLOW = [];
}
function eyeAt(ex, ey, rx, ry, col, o, look) {
  if (o.creepy) { ell(ex, ey, rx, ry, '#050505'); ell(ex, ey, 2.6, 2.6, '#fff'); if (o.glow) glowAt(ex, ey, 3, '#ffffff'); return; }
  ell(ex, ey, rx, ry, '#ece8e0');
  const px = ex + look * rx * 0.35, py = ey + 1;
  ell(px, py, rx * 0.52, ry * 0.5, col); ell(px, py, rx * 0.22, ry * 0.22, '#000'); ell(px - 2, py - 3, 1.6, 1.6, '#fff');
  if (o.glow) glowAt(px, py, rx * 0.45, col);
}
function teethRow(x0, x1, y, h, n, sharp, dir) {
  ctx.fillStyle = '#ece6d6'; const w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const xa = x0 + i * w; ctx.beginPath();
    if (sharp) { ctx.moveTo(xa, y); ctx.lineTo(xa + w, y); ctx.lineTo(xa + w / 2, y + h * dir); }

function drawBody(type, C) {
  ctx.fillStyle = C.dark;
  rr(-56, 228, 42, 120, 16); ctx.fill(); rr(14, 228, 42, 120, 16); ctx.fill();
  rr(-106, 78, 34, 152, 17); ctx.fill(); rr(72, 78, 34, 152, 17); ctx.fill();
  ell(-89, 232, 21, 19, C.main);
  if (type === 'foxy') { ctx.strokeStyle = '#b8b8b8'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(96, 252, 17, Math.PI * 0.9, Math.PI * 2.3); ctx.stroke(); }
  else ell(89, 232, 21, 19, C.main);

  ell(0, 150, 74, 94, C.main);
  if (type === 'foxy') {
    ell(0, 165, 44, 58, '#1a0e0a'); ctx.strokeStyle = '#6d6d6d'; ctx.lineWidth = 5;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-28, 132 + i * 20); ctx.lineTo(28, 132 + i * 20); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, 114); ctx.lineTo(0, 218); ctx.stroke();

  if (type === 'chica') {
    ctx.fillStyle = '#f2f0ea'; rr(-52, 92, 104, 96, 14); ctx.fill();
    txt('开吃啦!', 0, 138, 24, '#d0202a', 'center', FCN, 'bold');
    txt('!!!', 0, 168, 26, '#2a4ad0', 'center', FCN, 'bold');
  } else if (type !== 'foxy') {

function headFreddy(C, m, look, o) {

function headBonnie(C, m, look, o) {

function headChica(C, m, look, o) {

function checker(y0, y1, vx, w0, w1, c1, c2, rows = 10) {

    const wa = w0 + (w1 - w0) * fa, wb = w0 + (w1 - w0) * fb;
    const n = Math.min(70, Math.ceil(Math.max(vx, WORLD - vx) / wa) + 1);

    }
  }
}

function updatePlay(dt) {
  G.t += dt;
  G.camAnim += clamp((G.cam ? 1 : 0) - G.camAnim, -dt * 5, dt * 5);
  G.doorLA += clamp((G.doorL ? 1 : 0) - G.doorLA, -dt * 6, dt * 6);
  G.doorRA += clamp((G.doorR ? 1 : 0) - G.doorRA, -dt * 6, dt * 6);
  G.disrupt = Math.max(0, G.disrupt - dt); G.switchT = Math.max(0, G.switchT - dt);
  if (!G.cam) {
    let v = keys.scroll;
    if (mouse.active && mouse.y < H - 60) { if (mouse.x < W * 0.25) v -= 1 - mouse.x / (W * 0.25); else if (mouse.x > W * 0.75) v += (mouse.x - W * 0.75) / (W * 0.25); }
    G.scroll = clamp(G.scroll + v * 900 * dt, 0, WORLD - W);
  }
  G.time += dt;
  const hr = Math.floor(G.time / HOUR);
  if (hr !== G.hour) { G.hour = hr; onHour(hr); }
  if (G.time >= HOUR * 6) return win();
  if (G.phone) { G.phone.t -= dt; if (G.phone.t <= 0) { G.phone.i++; if (G.phone.i >= G.phone.lines.length) G.phone = null; else G.phone.t = 5.4; } }
  if (G.powerOut) {
    const p = G.po; p.t -= dt;
    if (p.phase === 'dark' && p.t <= 0) { p.phase = 'music'; p.t = rnd(6, 18); }
    else if (p.phase === 'music') {
      p.nt -= dt;
      if (p.nt <= 0) { const [m, b] = MELODY[p.note % MELODY.length]; AU.mbNote(m); p.nt = b * 0.38; p.note++; p.flash = Math.random() < 0.55; }
      if (p.t <= 0) { p.phase = 'black'; p.t = rnd(2, 5); AU.steps(3, 0.6, 0.35); }
    } else if (p.phase === 'black' && p.t <= 0) jumpscare('freddy');
    return;
  }
  G.power -= (usage() * 0.09 + EXTRA[G.night]) * dt;
  if (G.power <= 0) return powerOutStart();
  for (const k of ['freddy', 'bonnie', 'chica']) { const a = G.a[k]; a.timer -= dt; if (a.timer <= 0) { a.timer += INTERVAL[k]; opportunity(k); } }
  const f = G.foxy; f.timer -= dt;
  if (f.timer <= 0) {
    f.timer += 5.01;
    if (!f.running && f.stage < 3 && !G.cam && ri(1, 20) <= G.ai.foxy) { f.stage++; if (f.stage === 3) { f.wait = 0; f.limit = rnd(18, 28); } }
  }
  if (f.stage === 3 && !f.running) {
    f.wait += dt;
    if ((G.cam && G.camId === '2A' && G.camAnim > 0.9) || f.wait > f.limit) { f.running = true; f.runT = 0; AU.foxyRun(); }
  }
  if (f.running) {
    f.runT += dt;
    if (f.runT >= 2.4) {
      f.running = false;
      if (G.doorLA > 0.9) { AU.knock(); G.power -= 1 + 5 * f.knocks; f.knocks++; f.stage = ri(0, 1); f.wait = 0; }
      else return jumpscare('foxy');
    }
  }
  if (G.inside) {
    if (G.cam) G.inside.armed = true;
    else if (G.inside.armed) return jumpscare(G.inside.who);
    else { G.inside.t -= dt; if (G.inside.t <= 0) return jumpscare(G.inside.who); }
  }
  if (G.cam && G.camId === '6' && (at('6').length) && Math.random() < dt * 2.5) AU.clang();
  G.ambT -= dt;
  if (G.ambT <= 0) { G.ambT = rnd(20, 45); pick([() => AU.groan(), () => AU.steps(2, 0.7, 0.08), () => AU.clang()])(); }
}

function update(dt) {
  G.t = (G.t || 0) + (G.state === 'play' ? 0 : dt);
  if (G.state === 'intro') { G.introT += dt; if (G.introT > 3) { G.state = 'play'; AU.startLoops(); if (G.phone) AU.ring(); } }
  else if (G.state === 'play') updatePlay(dt);
  else if (G.state === 'jumpscare') { G.js.t += dt; if (G.js.t > 1.3) { G.state = 'over'; G.overT = 0; } }
  else if (G.state === 'over') { G.overT += dt; if (G.overT > 6) toMenu(); }
  else if (G.state === 'win') { G.winT += dt; if (G.winT > 10) toMenu(); }
}

  const t = G.t;
  const tw = Math.random() < 0.04;
  ctx.save(); ctx.globalAlpha = tw ? 0.9 : 0.55 + Math.sin(t * 0.8) * 0.08;
  drawChar('freddy', 920 + (tw ? rnd(-6, 6) : 0), 330, 2.3, { creepy: tw || Math.sin(t * 0.3) > 0.85, look: 0 });
  ctx.restore();
  const vg = ctx.createRadialGradient(900, 330, 100, 900, 330, 700); vg.addColorStop(0, 'rgba(0,0,0,0.1)'); vg.addColorStop(1, 'rgba(0,0,0,0.95)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawStatic(0.08 + (tw ? 0.25 : 0) + Math.random() * 0.05);
  txt('玩具熊的', 90, 170, 78, '#f2f2f2', 'left', FCN, 'bold');
  txt('午夜后宫', 90, 262, 78, '#f2f2f2', 'left', FCN, 'bold');
  txt('FIVE NIGHTS', 96, 310, 40, '#999', 'left', FNUM);
  for (const m of menuItems()) {
    const hov = mouse.x > m.x && mouse.x < m.x + m.w && mouse.y > m.y - 40 && mouse.y < m.y + 12;
    txt((hov ? '>> ' : '') + m.label, m.x, m.y, 40, hov ? '#fff' : '#bbb', 'left', FCN, 'bold');
  }
  txt('A / D 开关左右门　·　Q / E 门灯　·　空格 监控　·　鼠标靠边转头　·　Esc 返回', 90, 676, 18, '#777');
  txt('同人致敬作品 · 仅供娱乐', 1250, 700, 16, '#555', 'right');
}
function drawCustom() {
  drawStatic(0.06);
  txt('自定义之夜', 640, 90, 56, '#fff', 'center', FCN, 'bold');
  const ks = ['freddy', 'bonnie', 'chica', 'foxy'];
  ks.forEach((k, i) => {
    const x = 220 + i * 280;
    ctx.fillStyle = '#151515'; rr(x - 110, 140, 220, 380, 10); ctx.fill();
    ctx.save(); ctx.beginPath(); rr(x - 110, 140, 220, 380, 10); ctx.clip(); drawChar(k, x, 270, 0.95, {}); ctx.restore();
    txt(CHARS[k].name, x, 560, 30, '#fff', 'center', FCN, 'bold');
    txt('◀', x - 70, 622, 44, '#ccc', 'center', FNUM); txt('▶', x + 70, 622, 44, '#ccc', 'center', FNUM);
    txt(String(SAVE.custom[i]), x, 624, 56, '#fff', 'center', FNUM);
  });
  txt('>> 开 始', 1100, 690, 34, '#fff', 'center', FCN, 'bold');
  txt('返 回', 160, 690, 30, '#aaa', 'center', FCN, 'bold');
}
function drawIntro() {
  const a = G.introT < 2.4 ? 1 : Math.max(0, 1 - (G.introT - 2.4) / 0.6);
  ctx.globalAlpha = a;
  txt('12:00 AM', 640, 330, 96, '#fff', 'center', FNUM);
  txt(G.night === 7 ? '自定义之夜' : `第 ${G.night} 夜`, 640, 410, 44, '#fff', 'center', FCN, 'bold');
  ctx.globalAlpha = 1;
  drawStatic(G.introT < 0.4 ? 0.6 - G.introT : 0.04);
}
function drawPlay() {
  if (G.cam && G.camAnim > 0.999) drawCamView();
  else {
    drawOffice();
    if (G.camAnim > 0.001) {
      const y = H * (1 - G.camAnim);
      ctx.fillStyle = '#161616'; rr(60, y + 24, W - 120, H - 30, 26); ctx.fill();
      ctx.fillStyle = '#050805'; rr(92, y + 56, W - 184, H - 96, 10); ctx.fill();
    }
  }
  if (!G.powerOut) drawHUD();
  drawPhone();
}
function drawJump() {
  const t = G.js.t, who = G.js.who;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sx = rnd(-22, 22), sy = rnd(-18, 18);
  const s = (who === 'foxy' ? 2.7 : 2.5) + Math.min(1, t * 2.5) * 0.9;
  drawChar(who, 640 + sx, 400 + sy + (1 - Math.min(1, t * 4)) * 200, s, { mouth: 0.6 + 0.4 * Math.abs(Math.sin(t * 38)), glow: true, creepy: who !== 'foxy' && Math.sin(t * 50) > 0.3 });
  flushGlow();
  if (Math.random() < 0.25) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, 0, W, H); }
  drawStatic(0.12);
}
function drawOver() {
  drawStatic(G.overT < 2 ? 1 - G.overT * 0.4 : 0.25);
  if (G.overT > 1.5) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    txt('GAME OVER', 640, 340, 110, '#fff', 'center', FNUM);
    txt('你被塞进了玩偶服里……', 640, 410, 28, '#c33', 'center', FCN, 'bold');
    if (G.overT > 2.5) txt('点击返回主菜单', 640, 480, 22, '#888', 'center');
  }
}
function drawWin() {
  const t = G.winT;
  const p = clamp((t - 1.2) / 1.4, 0, 1), e = p * p * (3 - 2 * p);
  ctx.save(); ctx.beginPath(); ctx.rect(400, 260, 220, 120); ctx.clip();
  txt('5', 580, 360 - e * 120, 120, '#fff', 'right', FNUM); txt('6', 580, 480 - e * 120, 120, '#fff', 'right', FNUM);
  ctx.restore();
  txt('AM', 610, 360, 120, '#fff', 'left', FNUM);
  if (t > 4) {
    if (G.night >= 5) {
      const msg = G.night === 5 ? '恭喜！你熬过了一整周。　工资：120.50 元' : G.night === 6 ? '加班完成！　加班费：0.50 元　·　自定义之夜已解锁' : '自定义之夜通关！你是真正的夜班之王。';
      txt(msg, 640, 470, 30, '#ffd860', 'center', FCN, 'bold');
    } else txt(`第 ${G.night} 夜 完成`, 640, 470, 30, '#ddd', 'center', FCN, 'bold');
    if (t > 5) txt('点击继续', 640, 540, 22, '#888', 'center');
  }
}
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ({ menu: drawMenu, custom: drawCustom, intro: drawIntro, play: drawPlay, jumpscare: drawJump, over: drawOver, win: drawWin })[G.state]();
  GLOW = [];
}

// ============================================================ 输入
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const inBar = (x, y) => y > H - 56 && x > 340 && x < 840;
cv.addEventListener('pointermove', e => {
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (e.pointerType === 'mouse') {
    mouse.active = true;
    const b = inBar(p.x, p.y);
    if (b && !mouse.inBar && G.state === 'play') toggleCam();
    mouse.inBar = b;
  }
});
cv.addEventListener('pointerleave', () => { mouse.active = false; });
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') mouse.active = false; });
cv.addEventListener('pointerdown', e => {
  AU.init();
  const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (e.pointerType !== 'mouse') mouse.active = true;
  onClick(p.x, p.y, e.pointerType);
});
function onClick(x, y, ptype) {
  if (G.state === 'menu') { for (const m of menuItems()) if (x > m.x && x < m.x + m.w && y > m.y - 40 && y < m.y + 12) return m.act(); return; }
  if (G.state === 'custom') {
    for (let i = 0; i < 4; i++) {
      const cx = 220 + i * 280;
      if (y > 580 && y < 640) { if (Math.abs(x - (cx - 70)) < 30) SAVE.custom[i] = Math.max(0, SAVE.custom[i] - 1); if (Math.abs(x - (cx + 70)) < 30) SAVE.custom[i] = Math.min(20, SAVE.custom[i] + 1); }
    }
    save();
    if (y > 650 && x > 1000) startNight(7, true);
    if (y > 650 && x < 300) toMenu();
    return;
  }
  if (G.state === 'over') { if (G.overT > 1.5) toMenu(); return; }
  if (G.state === 'win') { if (G.winT > 4) toMenu(); return; }
  if (G.state !== 'play') return;
  if (G.phone && x < 150 && y < 60 && x > 20 && y > 20) { G.phone = null; return; }
  if (inBar(x, y)) { if (ptype !== 'mouse') toggleCam(); return; }
  if (G.cam) {
    for (const [id, c] of Object.entries(CAMS)) if (x > MAP_X + c.x && x < MAP_X + c.x + 56 && y > MAP_Y + c.y && y < MAP_Y + c.y + 28) return switchCam(id);
    return;
  }
  const wx = x + G.scroll;
  for (const s of ['L', 'R']) {
    const b = BTN[s];
    if (Math.hypot(wx - b.x, y - b.door) < 30) return toggleDoor(s);
    if (Math.hypot(wx - b.x, y - b.light) < 30) return toggleLight(s);
  }
}
addEventListener('keydown', e => {
  AU.init();
  const k = e.key.toLowerCase();
  if (k === ' ') e.preventDefault();
  if (G.state === 'play') {
    if (k === ' ' || k === 's') toggleCam();
    else if (k === 'a') toggleDoor('L');
    else if (k === 'd') toggleDoor('R');
    else if (k === 'q') toggleLight('L');
    else if (k === 'e') toggleLight('R');
    else if (k === 'arrowleft') keys.scroll = -1;
    else if (k === 'arrowright') keys.scroll = 1;
    else if (k === 'escape') toMenu();
  } else if (G.state === 'menu' && k === 'enter') menuItems()[menuItems().length > 1 ? 1 : 0].act();
  else if ((G.state === 'over' && G.overT > 1.5) || (G.state === 'win' && G.winT > 4) || (G.state === 'custom' && k === 'escape')) toMenu();
});
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'arrowright') keys.scroll = 0; });

// ============================================================ 主循环
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 调试钩子：?debug 时暴露状态，便于截图测试
if (location.search.includes('debug')) window.__G = () => G, window.__api = { startNight, toggleCam, switchCam, toggleDoor, toggleLight, setG: (f) => f(G) };
</script>
